<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a1018" />
<title>初代怪兽对战 · v1.0</title>
<link rel="stylesheet" href="style.css?v=22" />
</head>
<body>

<div class="wrap">

  <header class="head">
    <div class="logo">
      <span class="dot"></span>
      <h1>初代怪兽对战</h1>
      <span class="ver">v1.0</span>
      <button class="sfx-btn" id="sfxBtn" type="button" title="音效开关">🔊</button>
    </div>
    <p class="tagline">19 只 · 六种类型 · 场地 · 领域 · 羁绊 · 对波</p>
  </header>

  <!-- 模式选择 -->
  <section id="modeSelect" class="mode-select">
    <button class="mode-btn" data-mode="versus" type="button">
      <span class="mode-icon">⚔</span>
      <span class="mode-title">怪兽对战</span>
      <span class="mode-sub">3v3 · 对 AI</span>
    </button>
    <button class="mode-btn" data-mode="invade" type="button">
      <span class="mode-icon">🌍</span>
      <span class="mode-title">侵略地球</span>
      <span class="mode-sub">三轮 · 打威托，再打奥特曼</span>
    </button>
    <button class="mode-btn" data-mode="dex" type="button">
      <span class="mode-icon">📖</span>
      <span class="mode-title">图鉴</span>
      <span class="mode-sub">查看所有角色与技能</span>
    </button>
    <button class="mode-btn" data-mode="tutorial" type="button">
      <span class="mode-icon">🎓</span>
      <span class="mode-title">教程</span>
      <span class="mode-sub">一场战斗学会全部机制</span>
    </button>
  </section>

  <p class="ver-line" id="verLine">v1.0 · 已解锁 16 只</p>

  <!-- 图鉴 -->
  <section id="dex" class="dex" hidden>
    <div class="dex-head">
      <button id="dexBack" class="back-btn" type="button">← 返回</button>
      <span class="dex-title">图鉴</span>
    </div>
    <div class="pick-grid" id="dexGrid"></div>
  </section>

  <!-- 选人 -->
  <section id="pick" class="pick" hidden>
    <div class="pick-head">
      <button id="pickBack" class="back-btn pick-back" type="button">← 返回主界面</button>
      <div class="pick-lead">
        <h2 class="pick-title" id="pickTitle">怪兽对战</h2>
        <p class="pick-hint" id="pickHint">选 3 只，编成点数上限 20。每只带 4 个技能，可以自己配。</p>
      </div>
      <div class="cost-box" id="costBox">
        <span class="cost-label">编成点数</span>
        <div class="cost-track"><i id="costBar"></i></div>
        <span class="cost-num"><b id="costNum">0</b>/20</span>
      </div>
    </div>

    <div class="unlock-note" id="unlockNote" hidden></div>

    <div class="pick-grid" id="pickGrid"></div>

    <button class="start-btn" id="startBtn" type="button" disabled>还要选 3 只</button>
  </section>

  <!-- 战斗 -->
  <section id="battle" class="battle" hidden>

    <!-- 左上：对战信息 -->
    <div class="panel info-panel">
      <div class="panel-title">对战信息</div>
      <div class="log" id="log"></div>
      <div class="option-box" id="optionBox"></div>
    </div>

    <!-- 右上：敌方 -->
    <div class="mon-card enemy" id="enemyCard">
      <div class="mon-left">
        <div class="mon-portrait" id="enemySprite"></div>
        <div class="mon-type" id="enemyType">—</div>
      </div>
      <div class="mon-body">
        <div class="mon-name" id="enemyName">—</div>
        <div class="mon-alias" id="enemySub"></div>
        <div class="mon-passive" id="enemyPassive"></div>
        <div class="mon-bars">
          <div class="row">
            <span class="lab">HP</span>
            <div class="bar hp"><i id="enemyHpBar"></i></div>
            <span class="num" id="enemyHpTxt"></span>
          </div>
          <div class="row">
            <span class="lab">EP</span>
            <div class="bar ep"><i id="enemyEpBar"></i></div>
            <span class="num" id="enemyEpTxt"></span>
          </div>
        </div>
        <div class="state-icons" id="enemyDodge" hidden></div>
      </div>
    </div>

    <!-- 中间：VS / 计时器 / 场地 / 剩余 -->
    <div class="center-panel">
      <div class="vs">VS</div>
      <div class="timer-circle" id="timerCircle">
        <div class="timer-ring"><b id="timerNum">24</b></div>
        <div class="timer-cap">回合</div>
      </div>
      <div class="site-line" id="siteBox"></div>
      <div class="bench-pair">
        <div class="bench-side">
          <div class="bench-dots" id="enemyBench"></div>
          <span class="bench-cap">敌方</span>
        </div>
        <div class="bench-side">
          <div class="bench-dots" id="playerBench"></div>
          <span class="bench-cap">我方</span>
        </div>
      </div>
      <div class="field-box" id="fieldBox" hidden></div>
      <div class="turn-line">第 <b id="turnNum">1</b> 回合</div>
    </div>

    <!-- 左下：我方 -->
    <div class="mon-card player" id="playerCard">
      <div class="mon-left">
        <div class="mon-portrait" id="playerSprite"></div>
        <div class="mon-type" id="playerType">—</div>
      </div>
      <div class="mon-body">
        <div class="mon-name" id="playerName">—</div>
        <div class="mon-alias" id="playerSub"></div>
        <div class="mon-passive" id="playerPassive"></div>
        <div class="mon-bars">
          <div class="row">
            <span class="lab">HP</span>
            <div class="bar hp"><i id="playerHpBar"></i></div>
            <span class="num" id="playerHpTxt"></span>
          </div>
          <div class="row">
            <span class="lab">EP</span>
            <div class="bar ep"><i id="playerEpBar"></i></div>
            <span class="num" id="playerEpTxt"></span>
          </div>
        </div>
        <div class="state-icons" id="playerDodge" hidden></div>
      </div>
    </div>

    <!-- 右下：技能 -->
    <div class="skill-panel" id="actions"></div>

    <div id="banner" class="banner" hidden></div>

    <div id="clashBox" class="clash-box" hidden></div>
    <div id="clashFx" class="clash-fx" hidden>
      <div class="cf-beam cf-left"></div>
      <div class="cf-beam cf-right"></div>
      <div class="cf-core"></div>
      <div class="cf-ring"></div>
    </div>

  </section>

  <div id="tutOverlay" class="tut-overlay" hidden>
    <div class="tut-card">
      <div class="tut-step" id="tutStep">1 / 9</div>
      <h3 class="tut-title" id="tutTitle"></h3>
      <p class="tut-text" id="tutText"></p>
      <button class="tut-next" id="tutNext" type="button">下一步</button>
    </div>
  </div>

  <footer class="foot">
    <span>本鱼做的原型 · 非商业同人练习</span>
  </footer>

</div>

<script src="game.js?v=31"></script>
</body>
</html>
